    import json

    def main(tablename, resourceid, unit, metricname, optimizationfrom, optimizationto, optimizationdelta):
        try:
            # Build SQL query using the provided table name (safe with identifier quoting)
            query = f"""
                SELECT SUM("billedcost")
                FROM "{tablename}"
                WHERE "resourceid" LIKE ?
            """
            cursor.execute(query, (resourceid.lower() + '%',))
            result = cursor.fetchone()

            billed_cost = result[0] if result and result[0] is not None else 0.0

            output = {
                "tablename": tablename,
                "resourceid": resourceid,
                "unit": unit,
                "metricname": metricname,
                "optimizationfrom": optimizationfrom,
                "optimizationto": optimizationto,
                "optimizationdelta": optimizationdelta,
                "billedCost": billed_cost
            }

            print(json.dumps(output))

        except Exception as e:
            print(json.dumps({"error": "Error executing query: " + str(e)}))
            raise


    if __name__ == "__main__":
        # Parse arguments
        args = {
            'tablename': '',
            'resourceid': '',
            'unit': '',
            'metricname': '',
            'optimizationfrom': '',
            'optimizationto': '',
            'optimizationdelta': ''
        }

        for i in range(5, len(sys.argv)):
            key_value = sys.argv[i]
